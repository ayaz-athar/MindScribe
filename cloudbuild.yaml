# ==============================================================================
# Google Cloud Build Pipeline for MindScribe AI
# Automatically builds container and deploys to Google Cloud Run with Secret Manager
# ==============================================================================
steps:
  # 1. Build Container Image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mindscribe-journal:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mindscribe-journal:latest'
      - '.'

  # 2. Push Container Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mindscribe-journal:$COMMIT_SHA'

  # 3. Deploy to Cloud Run with Secret Manager binding and ADC
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mindscribe-journal'
      - '--image=gcr.io/$PROJECT_ID/mindscribe-journal:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/mindscribe-journal:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/mindscribe-journal:latest'

options:
  logging: CLOUD_LOGGING_ONLY
